<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Sihaté</title>
<style>html,body{margin:0;height:100%;background:#000}video{width:100%;height:100%;display:block;object-fit:contain;background:#000}</style>
</head><body>
<video id="v" controls playsinline preload="metadata"></video>
<script>
var n=(location.search.match(/[?&]v=(\w+)/)||[])[1]||"pakar";
if(!/^(pakar|ladang|anugerah)$/.test(n)) n="pakar";
var v=document.getElementById("v");
v.poster="poster_"+n+".jpg"; v.src=n+".mp4";
v.onloadedmetadata=function(){try{parent.postMessage({sihateVideo:n,ok:true,dur:v.duration},"*")}catch(e){}};
v.onerror=function(){try{parent.postMessage({sihateVideo:n,ok:false,code:v.error&&v.error.code},"*")}catch(e){}};
</script>
</body></html>
